server:
  port: 8081

spring:
  profiles:
    active: dev
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        acknowledge-mode: auto
        retry:
          enabled: true
          initial-interval: 1000ms
          max-attempts: 5
          max-interval: 10000ms
          multiplier: 2.0
    template:
      mandatory: true
      retry:
        enabled: true
        initial-interval: 1000ms
        max-attempts: 5
        max-interval: 10000ms
        multiplier: 2.0

reader:
  input-directory: ${READER_INPUT_DIRECTORY:data/input}
  output-directory: ${READER_OUTPUT_DIRECTORY:data/output}
  batch-size: ${READER_BATCH_SIZE:10}
  poll-interval-ms: ${READER_POLL_INTERVAL_MS:5000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.example.reader: INFO
    org.springframework.amqp: INFO
